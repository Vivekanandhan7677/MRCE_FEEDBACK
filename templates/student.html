<!DOCTYPE html>
<html>
<head>
<title>Student Feedback Form</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#36d1dc,#5b86e5);
display:flex;
justify-content:center;
align-items:center;
padding:30px 0;
}

.card{
background:#fff;
width:950px;
padding:30px 40px;
border-radius:12px;
box-shadow:0 20px 40px rgba(0,0,0,0.25);
position:relative;
}

.logout{
position:absolute;
right:30px;
top:30px;
text-decoration:none;
color:#fff;
background:#ff4d4d;
padding:8px 14px;
border-radius:6px;
font-size:14px;
}

.header{
text-align:center;
margin-bottom:20px;
}

.logo{
width:90px;
display:block;
margin:0 auto;
}

.header h1{
color:#0b3d91;
font-size:26px;
margin-top:8px;
font-weight:700;
}

h2{
text-align:center;
margin-bottom:25px;
color:#333;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.form-row{
display:flex;
flex-direction:column;
}

label{
font-weight:600;
margin-bottom:6px;
color:#444;
}

input[type="text"], select{
padding:10px 12px;
border:1px solid #ccc;
border-radius:6px;
font-size:14px;
}

h3{
margin:25px 0 10px;
color:#222;
border-bottom:2px solid #eee;
padding-bottom:6px;
}

.question{
margin-top:18px;
padding:15px;
background:#f8f9fc;
border-radius:8px;
}

textarea{
width:100%;
margin-top:10px;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
}

button{
margin-top:30px;
width:100%;
padding:14px;
border:none;
border-radius:6px;
background:#36d1dc;
color:white;
font-size:17px;
font-weight:600;
cursor:pointer;
}

#counter{
text-align:center;
font-weight:bold;
margin-top:10px;
}

</style>
</head>

<body>

<div class="card">

<a href="/logout" class="logout">Logout</a>

<div class="header">
<img src="{{ url_for('static', filename='logo.png') }}" class="logo">
<h1>MALLA REDDY COLLEGE OF ENGINEERING</h1>
</div>

<h2>Student Feedback Form</h2>

<form method="POST">

<input type="hidden" name="all_feedback" id="all_feedback">

<div class="grid">

<div class="form-row">
<label>Name</label>
<input type="text" name="name" required>
</div>

<div class="form-row">
<label>Roll No</label>
<input type="text" name="roll" required>
</div>

<div class="form-row">
<label>Branch</label>
<select name="branch" id="branch" onchange="loadSubjects()" required>
<option value="">--Select Branch--</option>
<option value="CSE_AI_ML">CSE(AI&ML)</option>
<option value="CSE">CSE</option>
<option value="AI_DS">AI&DS</option>
<option value="CSD">CSD</option>
<option value="ECE">ECE</option>
<option value="IT">IT</option>
</select>
</div>

<div class="form-row">
<label>Year</label>
<select name="year" id="year" onchange="loadSubjects()" required>
<option value="">--Select Year--</option>
<option>I</option>
<option>II</option>
<option>III</option>
<option>IV</option>
</select>
</div>

<div class="form-row">
<label>Semester</label>
<select name="semester" id="semester" onchange="loadSubjects()" required>
<option value="">--Select Semester--</option>
<option>I</option>
<option>II</option>
</select>
</div>

<div class="form-row">
<label>Section</label>
<select name="section" id="section" onchange="loadSubjects()" required>
<option value="">Select Section</option>
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
<option>E</option>
<option>F</option>
</select>
</div>

<div class="form-row">
<label>Subject</label>
<input type="text" id="subject" readonly>
</div>

<div class="form-row">
<label>Faculty Name</label>
<input type="text" id="faculty" readonly>
</div>

</div>

<div id="counter"></div>

<h3>Rate the following questions (1–5)</h3>

<script>
for(let i=1;i<=10;i++){
document.write(`
<div class="question">
<b>Q${i}. Question ${i}</b><br>
<label><input type="radio" name="q${i}" value="5"> 5</label>
<label><input type="radio" name="q${i}" value="4"> 4</label>
<label><input type="radio" name="q${i}" value="3"> 3</label>
<label><input type="radio" name="q${i}" value="2"> 2</label>
<label><input type="radio" name="q${i}" value="1"> 1</label>
</div>
`);
}
</script>

<div class="question">
<b>Any Suggestions (Optional)</b>
<textarea name="suggestion" rows="4"></textarea>
</div>

<button type="button" id="nextBtn" onclick="nextSubject()">Next Subject</button>

<button type="submit" id="submitBtn" style="display:none;">Submit All Feedback</button>

</form>

</div>

<script>

let subjects=[];
let currentIndex=0;
let feedbackData=[];

function loadSubjects(){

let b=branch.value;
let y=year.value;
let s=semester.value;
let sec=section.value;

if(b && y && s && sec){

fetch(`/get_subjects?branch=${b}&year=${y}&semester=${s}&section=${sec}`)
.then(res=>res.json())
.then(data=>{

subjects=data.subjects;
currentIndex=0;

if(subjects.length>0){
showSubject();
}

});

}

}

function showSubject(){

subject.value=subjects[currentIndex].subject;
faculty.value=subjects[currentIndex].faculty;

counter.innerText="Subject "+(currentIndex+1)+" of "+subjects.length;

}

function nextSubject(){

let answers={};

for(let i=1;i<=10;i++){

let val=document.querySelector(`input[name="q${i}"]:checked`);

if(!val){
alert("Please answer all questions");
return;
}

answers["q"+i]=val.value;

}

answers["subject"]=subjects[currentIndex].subject;
answers["faculty"]=subjects[currentIndex].faculty;

feedbackData.push(answers);

currentIndex++;

document.querySelectorAll('input[type="radio"]').forEach(r=>r.checked=false);
document.querySelector("textarea").value="";

if(currentIndex<subjects.length){

showSubject();

}else{

document.getElementById("nextBtn").style.display="none";
document.getElementById("submitBtn").style.display="block";

document.getElementById("all_feedback").value=JSON.stringify(feedbackData);

}

}

</script>

</body>
</html>
